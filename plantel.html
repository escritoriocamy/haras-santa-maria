<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plantel · Yeguas madre y producción · Haras Santa María de Juncal</title>
<meta name="description" content="Yeguas madre y producción del Haras Santa María de Juncal: genealogía, pelaje, año y país de cada ejemplar.">
<meta name="theme-color" content="#13202c">
<link rel="icon" type="image/png" href="img/marca-azul.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<section class="banner">
  <img src="img/ig-destete.jpg" alt="">
  <div class="contenedor">
    <div class="antetitulo">Plantel</div>
    <h1>Yeguas madre <em>y producción</em></h1>
    <p>El origen de cada generación del Haras: un plantel de yeguas de Uruguay, Argentina, Brasil, Chile y Estados Unidos.</p>
  </div>
</section>

<section class="seccion" style="padding-top:60px">
  <div class="contenedor">
    <div class="pestanas" role="tablist">
      <button class="pestana activa" role="tab" data-tab="yeguas">Yeguas madre<span id="n-yeguas"></span></button>
      <button class="pestana" role="tab" data-tab="produccion">Producción<span id="n-produccion"></span></button>
    </div>

    <div id="tab-yeguas">
      <div class="buscador">
        <input type="search" id="buscar-yeguas" placeholder="Buscar por nombre, padre o madre…" aria-label="Buscar yegua">
        <select id="pais-yeguas" aria-label="Filtrar por país"><option value="">Todos los países</option></select>
      </div>
      <div class="grilla-yeguas" id="yeguas"></div>
    </div>

    <div id="tab-produccion" class="oculto">
      <div class="buscador">
        <input type="search" id="buscar-prod" placeholder="Buscar por nombre, padre o madre…" aria-label="Buscar producto">
        <select id="padre-prod" aria-label="Filtrar por padre"><option value="">Todos los padres</option></select>
        <select id="anio-prod" aria-label="Filtrar por generación"><option value="">Todas las generaciones</option></select>
      </div>
      <div class="tabla-marco">
        <table class="tabla">
          <thead><tr><th>Nombre</th><th>Gen.</th><th>Sexo</th><th>Pelaje</th><th>Padre</th><th>Madre</th><th>Abuelo materno</th></tr></thead>
          <tbody id="produccion"></tbody>
        </table>
      </div>
      <p class="pedigri-nota" id="n-filtrados"></p>
    </div>
  </div>
</section>

<script src="js/config.js"></script>
<script src="js/comun.js"></script>
<script>
(function () {
  const H = window.Haras;
  const esc = H.esc;
  H.encabezado("plantel", true);
  H.pie();

  const PAISES = { URU: "Uruguay", ARG: "Argentina", BRA: "Brasil", USA: "Estados Unidos", CHI: "Chile" };
  const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const pel = (s) => String(s || "").replace(/^Alazan$/i, "Alazán");

  function tab(nombre) {
    document.querySelectorAll(".pestana").forEach((b) => b.classList.toggle("activa", b.dataset.tab === nombre));
    document.getElementById("tab-yeguas").classList.toggle("oculto", nombre !== "yeguas");
    document.getElementById("tab-produccion").classList.toggle("oculto", nombre !== "produccion");
    history.replaceState(null, "", location.pathname + location.search + "#" + nombre);
  }
  document.querySelectorAll(".pestana").forEach((b) => b.addEventListener("click", () => tab(b.dataset.tab)));

  fetch("data/plantel.json").then((r) => r.json()).then((d) => {
    const yeguas = d.yeguas, prod = d.produccion;
    document.getElementById("n-yeguas").textContent = yeguas.length;
    document.getElementById("n-produccion").textContent = prod.length;

    /* Yeguas madre */
    const selPais = document.getElementById("pais-yeguas");
    [...new Set(yeguas.map((y) => y.pais))].sort().forEach((p) => selPais.insertAdjacentHTML("beforeend", '<option value="' + p + '">' + (PAISES[p] || p) + '</option>'));
    function pintarYeguas() {
      const q = norm(document.getElementById("buscar-yeguas").value);
      const pais = selPais.value;
      const lista = yeguas.filter((y) => (!pais || y.pais === pais) && (!q || norm(y.nombre + " " + y.padre + " " + y.madre + " " + y.abuelo).includes(q)));
      document.getElementById("yeguas").innerHTML = lista.map((y) =>
        '<article class="yegua">' +
          '<div class="yegua-top"><h3>' + esc(y.nombre) + '</h3><span class="pais" title="' + esc(PAISES[y.pais] || y.pais) + '">' + esc(y.pais) + '</span></div>' +
          '<div class="yegua-meta">' + esc(pel(y.pelaje)) + ' · ' + y.nac + '</div>' +
          '<div class="yegua-sangre">' + esc(y.padre) + ' <i>y</i> ' + esc(y.madre) + (y.abuelo ? '<br><i>por</i> ' + esc(y.abuelo) : "") + '</div>' +
        '</article>').join("") || '<p class="cargando" style="background:var(--blanco)">Sin resultados.</p>';
    }
    document.getElementById("buscar-yeguas").addEventListener("input", pintarYeguas);
    selPais.addEventListener("change", pintarYeguas);
    pintarYeguas();

    /* Producción */
    const selPadre = document.getElementById("padre-prod");
    const selAnio = document.getElementById("anio-prod");
    const cuenta = {};
    prod.forEach((p) => { cuenta[p.padre] = (cuenta[p.padre] || 0) + 1; });
    Object.keys(cuenta).sort((a, b) => cuenta[b] - cuenta[a] || a.localeCompare(b)).forEach((p) =>
      selPadre.insertAdjacentHTML("beforeend", '<option value="' + esc(p) + '">' + esc(p) + ' (' + cuenta[p] + ')</option>'));
    [...new Set(prod.map((p) => p.nac))].sort((a, b) => b - a).forEach((a) => selAnio.insertAdjacentHTML("beforeend", '<option value="' + a + '">Generación ' + a + '</option>'));

    const params = new URLSearchParams(location.search);
    if (params.get("padre")) selPadre.value = params.get("padre");

    function pintarProd() {
      const q = norm(document.getElementById("buscar-prod").value);
      const padre = selPadre.value, anio = selAnio.value;
      const lista = prod.filter((p) => (!padre || p.padre === padre) && (!anio || String(p.nac) === anio) &&
        (!q || norm(p.nombre + " " + p.padre + " " + p.madre + " " + p.abuelo).includes(q)));
      document.getElementById("produccion").innerHTML = lista.map((p) =>
        '<tr><td class="nombre">' + esc(p.nombre) + '</td><td>' + p.nac + '</td><td class="sexo">' + (p.sexo === "H" ? "Hembra" : "Macho") + '</td><td>' + esc(pel(p.pelaje)) + '</td>' +
        '<td>' + esc(p.padre) + '</td><td>' + esc(p.madre) + '</td><td>' + esc(p.abuelo) + '</td></tr>').join("") ||
        '<tr><td colspan="7" style="text-align:center;color:var(--suave)">Sin resultados.</td></tr>';
      document.getElementById("n-filtrados").textContent = "Mostrando " + lista.length + " de " + prod.length + " productos.";
    }
    document.getElementById("buscar-prod").addEventListener("input", pintarProd);
    selPadre.addEventListener("change", pintarProd);
    selAnio.addEventListener("change", pintarProd);
    pintarProd();

    if (location.hash === "#produccion" || params.get("padre")) tab("produccion");
  });
})();
</script>
</body>
</html>
